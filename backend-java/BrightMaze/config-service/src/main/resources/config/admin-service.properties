# Server Configuration
server.port=8093

# Database Configuration
spring.datasource.url=jdbc:mysql://admin-database:3306/admin_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true


spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://discovery-service:8061/eureka/


server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

jwt.secret=BKMS
jwt.expirationMs=86400000

# admin-service/src/main/resources/application.properties
service.name=admin-service-active
service.log-dir=admin-service/logs/
cordi.api.url=http://fastapi_app:8001/